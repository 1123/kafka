name: Agent Guardrails

# Separate from ci.yml / build.yml. Those workflows still own the full
# "check releaseTarGz" and JUnit matrix. This job only runs Checkstyle
# (and, on a manual run, SpotBugs) for Gradle modules the diff touches.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run-spotbugs:
        description: "Also run spotbugsMain. SpotBugs compiles main sources."
        type: boolean
        default: false
      base-ref:
        description: "Branch to diff against when this is not a pull request."
        type: string
        default: trunk

permissions:
  contents: read

concurrency:
  group: agent-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: Checkstyle changed modules
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: "17"
          gradle-cache-read-only: "true"
          gradle-cache-write-only: "false"

      - name: Checkstyle on changed modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base-ref || 'trunk' }}
          RUN_SPOTBUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.run-spotbugs && 'true' || 'false' }}
        run: |
          set -euo pipefail
          TASK_FILE="${RUNNER_TEMP:-/tmp}/agent-guardrail-tasks.txt"
          python3 - <<'PY' > "$TASK_FILE"
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          def run(args):
              return subprocess.run(args, check=False, text=True, capture_output=True)

          def ensure_commit(rev):
              probe = run(["git", "cat-file", "-e", rev + "^{commit}"])
              if probe.returncode != 0:
                  fetch = run(["git", "fetch", "--no-tags", "origin", rev])
                  if fetch.returncode != 0:
                      raise SystemExit(fetch.stderr.strip() or f"cannot fetch {rev}")

          event = os.environ.get("EVENT_NAME", "")
          if event == "pull_request" and os.environ.get("BASE_SHA") and os.environ.get("HEAD_SHA"):
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              ensure_commit(base)
              ensure_commit(head)
          elif event == "pull_request":
              base, head = "HEAD^1", "HEAD"
          else:
              ref = os.environ.get("BASE_REF") or "trunk"
              fetch = run(["git", "fetch", "--no-tags", "origin", ref])
              if fetch.returncode != 0:
                  raise SystemExit(fetch.stderr.strip() or f"cannot fetch origin/{ref}")
              base, head = f"origin/{ref}", "HEAD"

          diff = run(["git", "diff", "--name-only", base, head])
          if diff.returncode != 0:
              raise SystemExit(diff.stderr.strip() or "git diff failed")
          files = [line for line in diff.stdout.splitlines() if line]
          print(f"# diff {base} {head} ({len(files)} files)", file=sys.stderr)

          text = Path("settings.gradle").read_text(encoding="utf-8")
          match = re.search(r"(?ms)^include\b(.*?)^project\(", text)
          if not match:
              raise SystemExit("could not parse settings.gradle include list")
          names = re.findall(r"'([^']+)'", match.group(1))
          projects = sorted(
              ((name.replace(":", "/"), ":" + name) for name in names),
              key=lambda item: len(item[0]),
              reverse=True,
          )

          def classify(path):
              if path.startswith("checkstyle/") or path.startswith("gradle/"):
                  return "ALL"
              if "/" not in path and (path.endswith(".gradle") or path.endswith(".kts") or path == "settings.gradle"):
                  return "ALL"
              if "/src/" in path or path.endswith(".gradle") or path.endswith(".gradle.kts"):
                  return "MODULE"
              return "SKIP"

          def project_for(path):
              for directory, gradle_path in projects:
                  if path == directory or path.startswith(directory + "/"):
                      return gradle_path
              return None

          run_all = False
          selected = set()
          for path in files:
              kind = classify(path)
              if kind == "ALL":
                  run_all = True
              elif kind == "MODULE":
                  gradle_path = project_for(path)
                  if gradle_path:
                      selected.add(gradle_path)
                  else:
                      print(f"# no Gradle project for {path}", file=sys.stderr)

          spotbugs = os.environ.get("RUN_SPOTBUGS") == "true"
          tasks = []
          if run_all:
              tasks.extend(["checkstyleMain", "checkstyleTest"])
              if spotbugs:
                  tasks.append("spotbugsMain")
          else:
              for gradle_path in sorted(selected):
                  tasks.append(gradle_path + ":checkstyleMain")
                  tasks.append(gradle_path + ":checkstyleTest")
                  if spotbugs:
                      tasks.append(gradle_path + ":spotbugsMain")
          for task in tasks:
              print(task)
          PY
          if [[ ! -s "$TASK_FILE" ]]; then
            echo "No Java or Scala modules changed. Skipping Gradle."
            exit 0
          fi
          mapfile -t TASKS < "$TASK_FILE"
          printf 'Gradle tasks:\n'
          printf '  %s\n' "${TASKS[@]}"
          ./gradlew --build-cache "${TASKS[@]}"
